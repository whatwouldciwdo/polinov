services:
  polinov-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polinov-app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      # Persistent storage for uploaded candidate files and photos
      - ./public/uploads:/app/public/uploads
