services:
  polinov-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polinov-app
    restart: always
    ports:
      - "3113:3113"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3113
      - HOSTNAME=0.0.0.0
    volumes:
      # Persistent storage for uploaded candidate files and photos
      - ./public/uploads:/app/public/uploads
